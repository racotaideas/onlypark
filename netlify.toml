# rebuild-marker: 1785568391.3682458
[build]
  publish = "app"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Redirect 301: cualquier acceso via onlypark.netlify.app -> onlypark.click
# Netlify solo hace match cuando la hostname del request es netlify.app.
[[redirects]]
  from = "https://onlypark.netlify.app/*"
  to = "https://onlypark.click/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://onlypark.netlify.app/*"
  to = "https://onlypark.click/:splat"
  status = 301
  force = true

# SPA fallback (siempre al final)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
